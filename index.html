<!DOCTYPE html>
<html lang="en">

    <head>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
        <link href="styles.css" rel="stylesheet">
        <title>Trivia!</title>
        <script>
            // Multiple choice checker
            function checkCapital(button) {
                const correctPlaceholder = document.getElementById("correctCapital");

                if (button.innerText !== "New Delhi") {
                    button.style.backgroundColor = "red";
                    correctPlaceholder.innerText = "Incorrect";
                } else {
                    button.style.backgroundColor = "green";
                    correctPlaceholder.innerText = "Correct";
                }
            }

            // Free response checker
            function checkContinent() {
                const correctPlaceholder = document.getElementById("correctResponse");
                const freeResponseAnswer = document.getElementById("freeResponse");

                if (freeResponseAnswer.value.trim() !== "Asia") {
                    correctPlaceholder.innerText = "Incorrect";
                    freeResponseAnswer.style.backgroundColor = "red";
                } else {
                    correctPlaceholder.innerText = "Correct";
                    freeResponseAnswer.style.backgroundColor = "green";
                }
            }
        </script>
    </head>

    <body>
        <div class="header">
            <h1>Trivia!</h1>
        </div>

        <div class="container">
            <div class="section">
                <h2>Part 1: Multiple Choice</h2>
                <hr>

                <h3>What is the capital of India?</h3>
                <p id="correctCapital"></p>

                <button onclick="checkCapital(this)">Chennai</button>
                <button onclick="checkCapital(this)">New Delhi</button>
                <button onclick="checkCapital(this)">Mumbai</button>
                <button onclick="checkCapital(this)">Pune</button>
            </div>

            <div class="section">
                <h2>Part 2: Free Response</h2>
                <hr>

                <h3>Which Continent is India Located in?</h3>
                <p id="correctResponse"></p>

                <input type="text" id="freeResponse">
                <button onclick="checkContinent()">Answer</button>
            </div>
        </div>
    </body>

</html>
